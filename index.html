<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>福岡・由布院 7天散步帖</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&display=swap">
<style>
:root{--bg:#f1f6ea;--card:#fffefa;--ink:#3f4a3a;--soft:#6f7d66;--pink:#bfdcae;--pink2:#e2efd6;--mint:#cfe6d2;--sky:#d3e4ea;--line:#cfe0c2;--accent:#3f7d52;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1f2a22;--card:#2a382d;--ink:#e8f0e0;--soft:#a9bba0;--pink:#4a6b4f;--pink2:#31443a;--mint:#2f4a3d;--sky:#2f4450;--line:#46604b;--accent:#9fd4a8}}
:root[data-theme="dark"]{--bg:#1f2a22;--card:#2a382d;--ink:#e8f0e0;--soft:#a9bba0;--pink:#4a6b4f;--pink2:#31443a;--mint:#2f4a3d;--sky:#2f4450;--line:#46604b;--accent:#9fd4a8}
html{height:100%;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Huninn","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;line-height:1.7;font-size:16px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.wrap{max-width:640px;margin:0 auto;padding:0 16px 48px}
header{text-align:center;padding:28px 8px 12px}
header h1{font-size:1.6rem;margin:0 0 6px;font-weight:400}
header p{margin:0;color:var(--soft);font-size:.92rem}
.date{margin:14px auto 0;display:inline-flex;gap:8px;align-items:center;font-size:.88rem;color:var(--soft)}
.date input{font:inherit;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:4px 10px}
.route{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin:16px 0 6px;font-size:.85rem}
.route span{background:var(--card);border:1.5px dashed var(--line);border-radius:999px;padding:3px 12px}
.route i{font-style:normal;color:var(--accent);align-self:center}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:11;background:var(--bg);padding:10px 0;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:0 0 auto;font:inherit;font-size:.85rem;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:6px 12px;cursor:pointer;text-align:center;line-height:1.3}
nav button small{display:block;color:var(--soft);font-size:.7rem}
nav button[aria-selected="true"]{background:var(--pink);border-color:var(--pink)}
nav button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.hero{background:var(--pink2);border-radius:22px;padding:16px 18px;margin:8px 0 18px}
.hero h2{margin:0;font-size:1.25rem;font-weight:400}
.hero p{margin:4px 0 0;color:var(--soft);font-size:.9rem}
.tl{position:relative;margin:0;padding:0;list-style:none}
.tl li{position:relative;padding:0 0 14px 44px}
.tl li::before{content:"";position:absolute;left:17px;top:34px;bottom:-4px;border-left:2px dashed var(--line)}
.tl li:last-child::before{display:none}
.dot{position:absolute;left:0;top:0;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:1.05rem;background:var(--pink2)}
.t-eat .dot{background:var(--mint)}.t-shop .dot{background:var(--sky)}.t-temple .dot{background:#fde7c8}
.t-move .dot{background:transparent;border:2px dashed var(--line)}
.card{background:var(--card);border-radius:18px;padding:10px 14px;border:1.5px solid var(--line)}
.t-move .card{background:transparent;border:0;padding:4px 0;color:var(--soft);font-size:.9rem}
.time{font-size:.78rem;color:var(--soft)}
.name{font-size:1.02rem}
.note{font-size:.88rem;color:var(--soft);margin-top:2px}
.card a{display:inline-block;margin-top:4px;font-size:.82rem;color:var(--accent);text-decoration:none;border-bottom:1.5px dotted var(--accent)}
.tips{background:var(--card);border:1.5px dashed var(--line);border-radius:18px;padding:14px 18px;margin-top:22px;font-size:.9rem}
.tips b{font-weight:400;color:var(--accent)}
.tips ul{margin:6px 0 0;padding-left:1.2em}
footer{text-align:center;color:var(--soft);font-size:.8rem;margin-top:22px}
.nav2{display:flex;justify-content:space-between;margin-top:8px}
.sb{fill:var(--pink);stroke:var(--ink);stroke-width:2.5}
.mascot{width:128px;height:auto;display:block;margin:0 auto 2px}
.div{display:block;margin:0 auto 14px;width:230px}.div svg{width:100%;height:auto}
.nav2 button{font:inherit;font-size:.9rem;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:8px 16px;cursor:pointer}
@media (prefers-reduced-motion:no-preference){.tl{animation:in .4s ease}@keyframes in{from{opacity:0}to{opacity:1}}}
</style>
</head>
<body>
<div class="wrap">
<header>
<svg class="mascot" viewBox="0 0 140 110" role="img" aria-label="森林小精靈"><ellipse cx="70" cy="100" rx="38" ry="6" fill="var(--line)"/><ellipse cx="70" cy="64" rx="44" ry="36" class="sb"/><ellipse cx="70" cy="76" rx="26" ry="18" fill="var(--card)"/><circle cx="56" cy="58" r="3.5" fill="var(--ink)"/><circle cx="84" cy="58" r="3.5" fill="var(--ink)"/><circle cx="46" cy="68" r="5" fill="var(--accent)" opacity=".3"/><circle cx="94" cy="68" r="5" fill="var(--accent)" opacity=".3"/><path d="M63 66q7 6 14 0" fill="none" stroke="var(--ink)" stroke-width="2.5" stroke-linecap="round"/><path d="M70 29c-14-2-18-16-8-24 12 2 18 14 8 24z" fill="var(--accent)"/><path d="M70 29c0-8 0-14-2-20" fill="none" stroke="var(--card)" stroke-width="1.8" stroke-linecap="round"/></svg>
<h1>🌳 福岡・由布院 7天散步帖</h1>
<p>像走進森林裡一樣，慢慢走、慢慢吃、泡泡湯 🍃</p>
<label class="date">出發日期 <input type="date" id="d0" aria-label="出發日期"></label>
<div class="route" aria-label="路線總覽"><span>福岡</span><i>›</i><span>太宰府</span><i>›</i><span>博多寺町</span><i>›</i><span>由布院 ♨</span><i>›</i><span>大濠・天神</span><i>›</i><span>回家</span></div>
</header>
<nav id="tabs" role="tablist" aria-label="每日行程"></nav>
<main id="day"></main>
<div class="tips">
<b>🎫 交通小提醒</b>
<ul>
<li>福岡市區：地下鐵＋西鐵公車很方便，可用 Suica／ICOCA 等交通 IC 卡，或手機加值。</li>
<li>由布院：JR 特急「由布院之森」全車指定席，座位少，請提早預約；也可搭高速巴士，兩種都約 2 小時多。</li>
<li>如果要跑太宰府＋由布院，可以比較一下北部九州的周遊券划不划算（出發前確認範圍與價格）。</li>
<li>所有時間都是大概的，出發前請以 Google 地圖與各家官網為準喔。</li>
</ul>
</div>
<footer>🌰 點每個景點下面的連結，就能直接開 Google 地圖</footer>
</div>
<script>
var D=[

 ["上午","太宰府天滿宮","學問之神，有心字池與太鼓橋，慢慢拍照","太宰府天滿宮","temple"],

 ["","西鐵 → 回博多","","","move"],

{e:"🙏",t:"博多寺町散步・逛街",s:"寺廟都擠在一小塊區域，走路就能全部逛完",

 ["晚上","溫泉旅館・會席料理","泡湯、吃晚餐、早點睡","由布院 溫泉旅館","eat"]]},
{e:"🌿",t:"由布院悠閒日",s:"什麼都不趕，像在森林裡午睡一樣",
 st:[
 ["早上","金鱗湖晨霧","天氣好、早晨溫差大時比較容易看到","金鱗湖","go"],
 ["上午","由布院 Floral Village","英國小鎮風格的雜貨小店","由布院フローラルビレッジ","shop"],
 ["中午","豐後牛或地雞午餐","當地食材很新鮮","由布院 豐後牛","eat"],
 ["下午","咖啡廳・足湯","找間喜歡的店，什麼都不做也很好","由布院 カフェ","go"],
 ["晚上","再泡一次溫泉","把整趟旅行的疲憊都泡掉 ♡","","go"]]},
{e:"🌳",t:"回福岡・大濠公園",s:"回到城市，找個地方呼吸一下",
 st:[
 ["上午","退房・最後逛一圈","買點由布院的伴手禮","由布院駅","shop"],
 ["","JR 由布院 → 博多","約 2 小時多","","move"],

 ["傍晚","天神最後血拼","Parco、大丸、藥妝都在附近","天神 Parco","shop"],
 ["晚上","晚餐：玄界灘海鮮","最後一頓好好吃","福岡 海鮮 居酒屋","eat"]]},
{e:"🛫",t:"最後一天・準備回家",s:"早點起床，把可愛的回憶帶回去",
 st:[
 ["早上","柳橋連合市場","福岡的廚房，早餐吃海鮮丼","柳橋連合市場","eat"],
 ["上午","伴手禮：通りもん・明太子","博多站或機場都買得到","博多駅 伴手禮","shop"],

 ["","辦理登機・免稅店","","福岡機場 國際線","go"]]}
];
var DIV='<div class="div" aria-hidden="true"><svg viewBox="0 0 240 32"><path d="M6 24h38M78 24h24M138 24h24M194 24h40" stroke="var(--line)" stroke-width="2" stroke-dasharray="3 5" stroke-linecap="round"/><path d="M52 24a9 8 0 0118 0z" fill="#e58a8a"/><rect x="58" y="24" width="6" height="6" rx="2" fill="var(--card)" stroke="var(--ink)" stroke-width="1.5"/><circle cx="57" cy="20" r="1.5" fill="#fff"/><circle cx="64" cy="19" r="1.5" fill="#fff"/><path d="M120 30V14" stroke="var(--accent)" stroke-width="2.5" stroke-linecap="round"/><path d="M120 18c-9 0-12-6-11-11 8 0 12 4 11 11z" fill="var(--accent)"/><path d="M120 14c8 0 11-5 10-10-8 0-11 4-10 10z" fill="var(--accent)" opacity=".7"/><ellipse cx="178" cy="24" rx="6" ry="6.5" fill="#c89b6a"/><path d="M171 21a7.5 5.5 0 0114 0z" fill="#8a6a45"/><path d="M178 15v-3" stroke="#8a6a45" stroke-width="2" stroke-linecap="round"/></svg></div>',W=["日","一","二","三","四","五","六"],icons={go:"🍃",eat:"🍙",shop:"🧺",temple:"⛩️",move:"👣"},cur=0;
var tabs=document.getElementById("tabs"),box=document.getElementById("day"),inp=document.getElementById("d0");
function lbl(i){if(!inp.value)return "Day "+(i+1);var p=inp.value.split("-"),d=new Date(+p[0],p[1]-1,+p[2]+i);return (d.getMonth()+1)+"/"+d.getDate()+"（"+W[d.getDay()]+"）"}
function esc(s){return s.replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function render(){
tabs.innerHTML=D.map(function(d,i){return '<button role="tab" aria-selected="'+(i==cur)+'" data-i="'+i+'">'+d.e+" D"+(i+1)+"<small>"+lbl(i).replace(/^Day \d/,"")+"</small></button>"}).join("");

var h='<section class="hero"><h2>'+d.e+" Day "+(cur+1)+"・"+esc(d.t)+"</h2><p>"+(inp.value?lbl(cur)+"　":"")+esc(d.s)+"</p></section>"+DIV+"<ul class=\"tl\">";
d.st.forEach(function(x){
var link=x[3]&&x[4]!="move"?'<br><a href="https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(x[3])+'" target="_blank" rel="noopener">在地圖上看看</a>':"";

</body>
</html>
